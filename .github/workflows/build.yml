name: Build POCO X8 Pro Kernel with SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          echo "Instalando herramientas esenciales para compilar..."
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 git wget curl ccache libncurses-dev
          echo "¡Dependencias instaladas correctamente!"

      - name: Clone Kernel Source
        run: |
          echo "Preparando clonación del kernel para klee..."
          mkdir -p kernel_workspace && cd kernel_workspace
          # Aquí clonaremos el árbol base del kernel en el próximo paso
          echo "Espacio de trabajo listo."
          

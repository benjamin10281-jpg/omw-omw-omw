name: Build POCO X8 Pro Kernel with SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          echo "Instalando herramientas esenciales..."
          sudo apt-get update && sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 git wget curl ccache libncurses-dev

      - name: Clone Toolchain (Clang)
        run: |
          echo "Descargando compilador Clang..."
          mkdir -p workspace && cd workspace
          git clone --depth=1 https://github.com/Lineberry/aarch64-linux-android-ld.lld.git toolchain || echo "Toolchain clonado o listo"
          echo "¡Toolchain preparado!"
